name: golf_diary_app
description: "A local-first, low-friction Golf Diary and Practice Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  geolocator: ^11.0.0
  firebase_core: ^2.30.0
  cloud_firestore: ^4.17.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.3
  sqlite3: ^2.4.0

flutter:
  uses-material-design: true
