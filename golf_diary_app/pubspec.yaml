name: golf_diary_app
description: "A local-first, low-friction Golf Diary and Practice Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0       # Playfair Display · Inter · Roboto Mono
  sqflite: ^2.3.0
  path: ^1.9.0
  geolocator: ^14.1.2
  firebase_core: ^5.1.0
  cloud_firestore: ^7.1.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.3
  sqlite3: ^3.9.0

flutter:
  uses-material-design: true
